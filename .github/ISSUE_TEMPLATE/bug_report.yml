name: Bug report
description: Something doesn't work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open index.html\n2. Click …\n3. See …"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Edge 131 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options: [Opened the file directly, Local web server / GitHub Pages, Wallpaper app, claude.ai Artifact]
  - type: dropdown
    id: quality
    attributes:
      label: Quality setting (HUD → Quality)
      options: [Eco, Balanced, Ultra, 4K, Not sure]
  - type: input
    id: gpu
    attributes:
      label: GPU (for 3D or performance issues)
  - type: textarea
    id: console
    attributes:
      label: Console errors or screenshots
      description: Press F12 → Console. Please remove any personal data first.
