<div class="vpanel" id="vpanel" role="dialog" aria-label="語音設定" hidden>

  <div class="vcols">
  <fieldset><legend>主播</legend><div class="cast" id="vcast"></div></fieldset>
  <fieldset><legend>播報方式</legend><div class="vopts" id="vmode"></div>
    <div id="vpartner-wrap"><div class="sub">搭檔</div><div class="cast mini" id="vpartner"></div></div></fieldset>
  <fieldset><legend>播報語言</legend><div class="vopts four" id="vlang"></div></fieldset>

    <label class="row"><input type="checkbox" id="vauto"> 每天第一次點擊時自動播放今日簡報</label>
    <label class="row"><input type="checkbox" id="vdonev"> 完成任務時角色回應一句</label></fieldset>
  <fieldset><legend>旁白播報範圍</legend><div class="vopts" id="vnarr"></div></fieldset>
  </div>
  <div class="vfoot" id="vfoot"></div>
  <p class="vnote" id="vnote"></p>
</div>
